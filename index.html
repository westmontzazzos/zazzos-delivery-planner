<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B50D0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Delivery">
<title>Zazzo’s Delivery</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E31010; --red-dk:#B50D0D; --black:#0D0D0D; --bg:#F8F7F5; --text:#2D2926;
  --g50:#FAFAF9; --g100:#F2F0EE; --g200:#E6E3E0; --g300:#D4D0CB; --g500:#8E8881; --g600:#6B6660;
  --green:#2E7D4F; --amber:#B26A00;
  --r:10px; --r-tile:14px; --r-pill:20px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* Header */
header{background:linear-gradient(135deg,var(--red) 0%,var(--red-dk) 100%);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 16px}
.brand{font:700 15px/1 "Libre Baskerville",Georgia,serif;opacity:.9;letter-spacing:.01em}
h1{font:400 34px/1 "Bebas Neue","Arial Narrow",sans-serif;letter-spacing:.04em;margin:6px 0 0}

/* Pills */
.pills{display:flex;gap:8px;padding:14px 16px 4px;overflow-x:auto}
.pill{border:1px solid var(--g300);background:#fff;border-radius:var(--r-pill);padding:8px 16px;font-weight:600;font-size:14px;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--black);border-color:var(--black);color:#fff}

main{max-width:600px;margin:0 auto;padding:10px 16px 40px}

/* Cards */
.card{background:#fff;border:1px solid var(--g200);border-radius:var(--r);padding:16px;margin-bottom:12px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--g600);margin:0 0 10px}

/* Snap */
.snap{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:var(--r);background:var(--black);color:#fff;padding:15px;font-weight:700;font-size:16px;position:relative;overflow:hidden}
.snap svg{width:20px;height:20px}
.snap input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.alt{display:block;text-align:center;margin-top:10px;font-size:14px;color:var(--g600);position:relative}
.alt span{text-decoration:underline;text-underline-offset:3px}
.alt input{position:absolute;inset:0;opacity:0;cursor:pointer}
.shot{display:none;align-items:center;gap:12px}
.shot.on{display:flex}
.shot img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--g200)}
.shot .meta{flex:1;min-width:0}
.shot .meta b{display:block;font-weight:600}
.shot .meta small{color:var(--g600)}
.linkbtn{border:0;background:none;color:var(--red);font-weight:600;padding:6px 0}

/* Drivers */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row .label{margin:0}
.stepper{display:flex;align-items:center;background:var(--g100);border-radius:var(--r-pill);padding:3px}
.stepper button{width:38px;height:38px;border:0;border-radius:50%;background:#fff;font-size:20px;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stepper output{min-width:44px;text-align:center;font:400 26px/1 "Bebas Neue",sans-serif;padding-top:3px}

/* Start */
.start{padding-top:28px;text-align:center}
.snap.big{padding:28px 16px;font-size:22px;border-radius:var(--r-tile);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.snap.big svg{width:28px;height:28px}
.from{margin:22px 0 0;color:var(--g600);font-size:14px}
.from b{color:var(--text)}
.from .linkbtn{padding:0}
#shot{background:#fff;border:1px solid var(--g200);border-radius:var(--r);padding:12px;margin-top:12px}

/* Mode */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--g100);border-radius:var(--r);padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:10px 0;font-weight:700;color:var(--g600)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.suggest{background:var(--black);color:#fff;border-radius:var(--r);padding:14px 16px;margin:14px 0}
.suggest p{margin:0 0 10px}
.suggest .btns{display:flex;gap:8px}
.suggest button{flex:1;border:0;border-radius:var(--r);padding:11px;font-weight:700}
.suggest .yes{background:var(--red);color:#fff}
.suggest .no{background:#333;color:#fff}
.replan{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 14px}
.replan button{border:1px solid var(--g300);background:#fff;border-radius:var(--r);padding:11px;font-weight:700}

/* Note */
.notebtn{border:0;background:none;color:var(--g600);font-weight:600;padding:2px 0;font-size:14px}
textarea{width:100%;border:1px solid var(--g300);border-radius:var(--r);background:var(--g50);padding:11px 12px;min-height:70px;resize:vertical;margin-top:10px;display:none}
textarea.on{display:block}

/* CTA */
.go{width:100%;border:0;border-radius:var(--r);background:var(--red);color:#fff;font:400 24px/1 "Bebas Neue",sans-serif;letter-spacing:.06em;padding:16px 0 14px;box-shadow:0 4px 14px rgba(227,16,16,.25);margin-top:4px}
.go.hidden{display:none}
.go:disabled{background:var(--g300);box-shadow:none;cursor:default}

/* Status */
.status{text-align:center;color:var(--g600);padding:24px 8px 8px}
.status.err{color:var(--red-dk)}
.spin{width:28px;height:28px;border:3px solid var(--g200);border-top-color:var(--red);border-radius:50%;margin:0 auto 12px;animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.ghost{display:block;margin:12px auto 0;border:1px solid var(--g300);background:#fff;border-radius:var(--r-pill);padding:8px 18px;font-weight:600}

/* Results */
.summary{font-weight:600;font-size:16px;margin:18px 2px 12px}
.drv{background:#fff;border:1px solid var(--g200);border-radius:var(--r-tile);margin-bottom:14px;overflow:hidden}
.drv-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--black);color:#fff}
.drv-h h2{font:400 26px/1 "Bebas Neue",sans-serif;letter-spacing:.04em;margin:0;padding-top:2px}
.leave{background:var(--red);border-radius:var(--r-pill);padding:4px 12px;font-weight:700;font-size:13px}
.drv-b{padding:4px 16px 16px}
.why{color:var(--g600);font-size:14px;margin:10px 0 0}
.name{width:100%;border:1px solid var(--g300);border-radius:var(--r);background:var(--g50);padding:10px 12px;margin:12px 0 4px}
ol.stops{list-style:none;margin:6px 0 0;padding:0;counter-reset:n}
ol.stops li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--g100);counter-increment:n}
ol.stops li:last-child{border-bottom:0}
ol.stops li::before{content:counter(n);width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.who{font-weight:700}
.who small{font-weight:500;color:var(--g500);margin-left:4px}
.addr{color:var(--g600);font-size:14px}
.when{font-size:13px;margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border-radius:var(--r-pill);padding:2px 9px;font-size:12px;font-weight:700;background:var(--g100);color:var(--g600)}
.chip.on_time{background:#E7F3EC;color:var(--green)}
.chip.early,.chip.tight{background:#FBF0DC;color:var(--amber)}
.chip.late{background:#FDE7E7;color:var(--red-dk)}
.acts{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-top:12px}
.acts a,.acts button{display:flex;align-items:center;justify-content:center;border-radius:var(--r);padding:11px 6px;font-weight:700;font-size:14px;text-decoration:none;border:1px solid var(--g300);background:#fff;color:var(--text)}
.acts .primary{background:var(--red);border-color:var(--red);color:#fff}
.msgbox{width:100%;margin-top:10px;border:1px solid var(--g300);border-radius:var(--r);padding:10px;font-size:13px;min-height:150px;display:none;background:var(--g50)}
.msgbox.on{display:block}
.idle{background:#fff;border:1px dashed var(--g300);border-radius:var(--r-tile);padding:14px 16px;color:var(--g600);margin-bottom:14px}
.flags{background:#FFF8EC;border:1px solid #F0DDB8;border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.flags b{display:block;margin-bottom:4px}
.flags ul{margin:0;padding-left:18px}
.foot{text-align:center;font-size:12px;color:var(--g500);margin:6px 0 0}
#toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--black);color:#fff;border-radius:var(--r);padding:14px 16px;font-weight:600;text-align:center;opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:20}
#toast.show{opacity:1;transform:none}
.hidden{display:none !important}
</style>
</head>
<body>
<header>
  <div class="brand">Zazzo’s</div>
  <h1>Delivery Planner</h1>
</header>

<input type="hidden" id="store" value="Zazzo's Darien, 7360 IL-83, Darien, IL 60561">

<main>
  <section id="form">
    <div id="pick" class="start">
      <label class="snap big">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Snap Screen
        <input id="cam" type="file" accept="image/*" capture="environment" aria-label="Take a photo of the dispatch screen">
      </label>
      <label class="alt"><span>or use a screenshot</span><input id="lib" type="file" accept="image/*" multiple aria-label="Choose a screenshot"></label>
      <p class="from">Leaving from <b id="storeName">Darien</b> · <button class="linkbtn" id="storeSwap">Change</button></p>
    </div>
    <div class="shot" id="shot">
      <img id="thumb" alt="Dispatch screen">
      <div class="meta"><b>Screen</b><small id="shotInfo">From Darien · Single</small></div>
    </div>
    <div class="seg hidden" role="group" aria-label="Stops per driver">
      <button data-mode="1" aria-pressed="true">Single</button>
      <button data-mode="2" aria-pressed="false">Double</button>
      <button data-mode="3" aria-pressed="false">Triple</button>
    </div>
    <textarea id="notes" class="hidden"></textarea>
    <button class="go hidden" id="go">Plan Routes</button>
  </section>

  <section id="out" aria-live="polite"></section>
</main>

<script>
(function(){
  const $ = id => document.getElementById(id);
  let files = [];
  let ctl = null;

  // Store
  const STORES = {
    Darien: "Zazzo's Darien, 7360 IL-83, Darien, IL 60561",
    Westmont: "Zazzo's Westmont, 200 W Ogden Ave, Westmont, IL 60559"
  };
  let storeKey = "Darien";
  function setStore(k){
    storeKey = STORES[k] ? k : "Darien";
    $("store").value = STORES[storeKey];
    $("storeName").textContent = storeKey;
    try { localStorage.setItem("zz-store-k", storeKey); } catch(e){}
  }
  try { setStore(localStorage.getItem("zz-store-k") || "Darien"); } catch(e){ setStore("Darien"); }
  $("storeSwap").onclick = () => setStore(storeKey === "Darien" ? "Westmont" : "Darien");

  // Stops per driver
  let mode = 1;
  const segs = document.querySelectorAll(".seg button");
  function setMode(m){
    mode = m;
    segs.forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.mode) === m)));
    if (typeof updateInfo === "function") try { updateInfo(); } catch(e){}
  }
  segs.forEach(b => b.addEventListener("click", () => setMode(Number(b.dataset.mode))));

  // Photo
  function onFiles(list){
    files = Array.from(list || []).slice(0, 4);
    if (!files.length) return;
    $("thumb").src = URL.createObjectURL(files[0]);
    $("pick").classList.add("hidden");
    $("shot").classList.add("on");
    updateInfo();
    $("go").onclick();
  }
  $("cam").addEventListener("change", e => onFiles(e.target.files));
  $("lib").addEventListener("change", e => onFiles(e.target.files));
  function clearPhoto(){
    files = []; $("cam").value = ""; $("lib").value = "";
    $("shot").classList.remove("on"); $("pick").classList.remove("hidden"); refresh();
  }

  function refresh(){}
  function updateInfo(){ $("shotInfo").textContent = "From " + storeKey + " · " + ({1:"Single",2:"Double",3:"Triple"}[mode]); }

  function status(msg, isErr){
    const o = $("out"); o.textContent = "";
    const p = document.createElement("p"); p.className = "status" + (isErr ? " err" : ""); p.textContent = msg; o.appendChild(p);
    return p;
  }

  function nowStr(){ return new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); }

  async function shrink(file){
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const max = 1600, r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL("image/jpeg", 0.82).split(",")[1];
    } finally { URL.revokeObjectURL(url); }
  }

  async function callPlan(prompt, imgs, signal){
    const res = await fetch("/api/plan", { method: "POST", headers: {"Content-Type":"application/json"}, signal, body: JSON.stringify({ prompt, images: imgs }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error(data.error || "error"); e.code = res.status === 429 ? "rate_limited" : (res.status === 500 ? "setup" : "server"); throw e; }
    const txt = String(data.text || "").replace(/```json|```/g, "").trim();
    const a = txt.indexOf("{"), b = txt.lastIndexOf("}");
    try { return JSON.parse(txt.slice(a, b + 1)); } catch(e){ const x = new Error("bad json"); x.code = "invalid_json"; throw x; }
  }

  function buildPrompt(){
    const store = $("store").value;
    const notes = $("notes").value.trim();
    const modeWord = {1:"SINGLE (1 order per driver per trip)", 2:"DOUBLE (at most 2 orders per trip)", 3:"TRIPLE (at most 3 orders per trip)"}[mode];
    return `You are the delivery dispatcher for a pizza restaurant in the western Chicago suburbs (DuPage County, IL). The image(s) show the restaurant's POS dispatch screen.

HOW TO READ THE SCREEN
- Top-left corner shows the current time (e.g. "12:13 pm"). Use it as NOW. If not visible, NOW = ${nowStr()}.
- ORDERS (right side). Columns: # (order number), Name, Def, Address, Time, elp.
  - Green check in Def = TIMED order: arrive AT the Time shown. A few minutes early is fine; more than ~10 min early is "early". Never late.
  - No check = REGULAR order: Time column is its deadline (60 min after it came in). Must arrive by then.
  - Addresses may be cut off or misspelled ("WILL(" = Willowbrook, "CLARE" = Clarendon Hills, "WESTMOI" = Westmont, "QUINCEY" = Quincy St). Fix to real addresses near the store. Ignore header lines like "Delivery: 45 = 12:58 pm".
- DRIVERS (left panel, columns Driver / Out / Est Return). Names usually start with Z; drop it ("ZEMILY" = Emily).
  - A driver WITH an Est Return time is OUT. They can leave again about 2 minutes after that time.
  - A driver with NO time next to them is IN the store and can leave now.

WHAT TO PLAN (IMPORTANT)
- REGULAR orders: always plan these.
- TIMED orders: leave them out of the plan, EXCEPT when a regular order would be delivered within 15 minutes before or after the timed order's time AND the two addresses are close together / in the same direction from the store. Only then pair the timed order onto that trip.
- A timed order that doesn't meet that test goes in "later" (the manager sends it at its time). Don't route it, don't give advice about it.
- Two timed orders can go together only if their times are within 15 minutes of each other and they're close together / same direction.
- Never pair stops in opposite directions from the store, no matter the times.

HOW TO PLAN
- If any drivers are IN: plan around them first. Use returning drivers only for orders the in-store drivers can't get to on time.
- If no drivers are IN: plan around the returning drivers, in the order they come back.
- A driver can do more than one trip. A second trip leaves when they get back (last stop + drive back to the store + 2 min). List each trip as its own entry with the same driver name, in time order.
- Stops per trip: ${modeWord}. Never put more orders on one trip than that.
- Within that limit: nothing late beats everything. Pair orders only when they're close together or in the same direction from the store, and both stay on time.
- Estimate driving with real local street geography: about 2 to 3 minutes per mile on suburban roads, plus 2 minutes per stop for the handoff.
- All trips start from: ${store}.
${notes ? "- Manager notes (follow these): " + notes : ""}

WHEN TO SUGGEST DOUBLING OR TRIPLING
Set "suggest" to "double" (or "triple" if already double) when, at the current setting, any order ends up late or tight, OR the orders on screen fill about half the list or more (roughly 6 or more waiting). Otherwise set it to null. Never change the setting yourself; plan at ${modeWord} and only suggest.

Reply with ONLY this JSON (no other text):
{
 "summary": "one plain sentence about the plan",
 "suggest": null,
 "suggest_reason": "short reason if suggest is set, else empty",
 "drivers": [
  {"driver": "Emily", "status_now": "In store" or "Back 12:18 PM", "leave_at": "12:20 PM", "note": "short why, plain words", "stops": [
    {"num": "10", "name": "ROCKS, D", "address": "7730 Eleanor Pl, Willowbrook, IL 60527", "kind": "regular", "due": "1:01 PM", "eta": "12:23 PM", "status": "on_time"}
  ]}
 ],
 "idle": ["names of drivers with nothing to do"],
 "later": [{"num": "1", "name": "HOUSE ACCOUNT", "kind": "timed", "due": "5:00 PM"}],
 "flags": ["anything unreadable, guessed, or at risk; empty array if none"]
}
kind is "timed" or "regular". status is one of on_time, early, tight (under 5 min to spare), late. Times like "12:14 PM". Full street addresses with city and state. If the drivers panel is empty or unreadable, use "Driver 1", "Driver 2", etc. and say so in flags.`;
  }

  $("go").onclick = async () => {
    if (!files.length) return;
    ctl = new AbortController();
    $("go").disabled = true;
    const o = $("out"); o.textContent = "";
    const box = document.createElement("div"); box.className = "status";
    const sp = document.createElement("div"); sp.className = "spin";
    const t = document.createElement("div"); t.textContent = "Reading the screen and planning routes…";
    const stop = document.createElement("button"); stop.className = "ghost"; stop.textContent = "Cancel"; stop.onclick = () => ctl.abort();
    box.append(sp, t, stop); o.appendChild(box);
    o.scrollIntoView({behavior:"smooth", block:"start"});
    try {
      const imgs = await Promise.all(files.map(shrink));
      const plan = await callPlan(buildPrompt(), imgs, ctl.signal);
      render(plan);
    } catch(e){
      const code = e && e.code;
      if (e && e.name === "AbortError") { o.textContent = ""; }
      else if (code === "rate_limited") status("Too many requests right now. Wait a minute and try again.", true);
      else if (code === "setup") status("The planner isn’t set up yet (missing key on Netlify).", true);
      else if (code === "invalid_json") status("Couldn’t read that photo. Try again or retake it closer.", true);
      else status("Something went wrong. Tap Plan Routes to try again.", true);
    } finally { refresh(); }
  };

  function mapsLink(origin, stops){
    if (!stops.length) return null;
    const addrs = stops.map(s => s.address || "");
    const dest = addrs[addrs.length-1];
    const way = addrs.slice(0,-1);
    let u = "https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=" + encodeURIComponent(origin.replace(/^Zazzo's \w+, /,"")) + "&destination=" + encodeURIComponent(dest);
    if (way.length) u += "&waypoints=" + encodeURIComponent(way.join("|"));
    return u;
  }

  const LABEL = {on_time:"On time", early:"Early", tight:"Tight", late:"Late"};

  function nice(s){
    return String(s || "").toLowerCase().replace(/\b([a-z])/g, m => m.toUpperCase())
      .replace(/\b(Il|Ne|Nw|Se|Sw)\b/g, m => m.toUpperCase())
      .replace(/,\s*$/, "").trim();
  }
  function shortAddr(a){
    return String(a || "").replace(/,?\s*(IL|Illinois)\s*\d{5}(-\d{4})?\s*$/i, "").replace(/,?\s*USA\s*$/i, "").trim();
  }
  function driverMsg(d, link, name){
    const n = d.stops.length;
    const out = [];
    out.push(name ? "Hi " + name + ", here’s your run." : "Here’s your run.");
    out.push("Leave at " + (d.leave_at || "now") + ", " + n + (n === 1 ? " stop" : " stops") + ".");
    d.stops.forEach((s, i) => {
      out.push("");
      out.push((i+1) + ". " + (nice(s.name) || "Customer") + (s.num != null ? " (order " + s.num + ")" : ""));
      out.push("    " + shortAddr(s.address));
      out.push("    " + (s.kind === "timed" ? "Deliver at " : "Deliver by ") + (s.due || "?"));
    });
    if (link) { out.push(""); out.push("Route map:"); out.push(link); }
    out.push(""); out.push("Thanks!");
    return out.join("\n");
  }

  function toast(msg){
    let t = document.getElementById("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
    t.textContent = msg; t.className = "show";
    clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = ""; }, 3000);
  }

  function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function render(plan){
    const o = $("out"); o.textContent = "";
    if (!plan || !Array.isArray(plan.drivers)) { status("Couldn’t build a plan from that photo. Try again.", true); return; }
    if (plan.summary) o.appendChild(el("p","summary", String(plan.summary)));
    const next = plan.suggest === "triple" ? 3 : (plan.suggest === "double" ? 2 : 0);
    if (next && next > mode) {
      const sg = el("div","suggest");
      sg.appendChild(el("p", null, (plan.suggest_reason ? plan.suggest_reason + " " : "") + (next === 2 ? "Double up the deliveries?" : "Triple up the deliveries?")));
      const bt = el("div","btns");
      const yes = el("button","yes", next === 2 ? "Double Up" : "Triple Up");
      const no = el("button","no","Keep as is");
      yes.onclick = () => { setMode(next); $("go").onclick(); };
      no.onclick = () => sg.remove();
      bt.append(yes, no); sg.appendChild(bt); o.appendChild(sg);
    }
    const origin = $("store").value;
    const active = plan.drivers.filter(d => Array.isArray(d.stops) && d.stops.length);
    const idle = [...(Array.isArray(plan.idle) ? plan.idle : []), ...plan.drivers.filter(d => !Array.isArray(d.stops) || !d.stops.length).map(d => d.driver)].filter(Boolean);

    active.forEach(d => {
      const c = el("div","drv");
      const h = el("div","drv-h");
      const label = (typeof d.driver === "number" || /^\d+$/.test(String(d.driver))) ? "Driver " + d.driver : String(d.driver || "Driver");
      h.appendChild(el("h2", null, label));
      h.appendChild(el("span","leave", "Leave " + (d.leave_at || "now")));
      c.appendChild(h);
      const b = el("div","drv-b");
      if (d.note || d.status_now) b.appendChild(el("p","why", [d.status_now, d.note].filter(Boolean).join(" · ")));
      const ol = el("ol","stops");
      d.stops.forEach(s => {
        const li = document.createElement("li");
        const body = document.createElement("div");
        const who = el("div","who", nice(s.name) || "Customer");
        if (s.num != null) who.appendChild(el("small", null, "#" + s.num));
        body.appendChild(who);
        body.appendChild(el("div","addr", shortAddr(s.address)));
        const w = el("div","when");
        w.appendChild(el("span", null, (s.kind === "timed" ? "At " : "By ") + (s.due || "?") + " · arrive ~" + (s.eta || "?")));
        if (s.status && LABEL[s.status]) w.appendChild(el("span","chip " + s.status, LABEL[s.status]));
        body.appendChild(w);
        li.appendChild(body);
        ol.appendChild(li);
      });
      b.appendChild(ol);

      const link = mapsLink(origin, d.stops);
      const nameIn = document.createElement("input"); nameIn.type = "text"; nameIn.className = "name"; nameIn.placeholder = "Driver’s name (for the text)"; nameIn.setAttribute("aria-label","Driver name");
      if (!/^Driver /.test(label)) { nameIn.value = label; nameIn.classList.add("hidden"); }
      b.appendChild(nameIn);

      const acts = el("div","acts");
      const cp = el("button","primary","Copy Route");
      const txt = el("a",null,"Text");
      const mp = el("a",null,"Map");
      const box = document.createElement("textarea"); box.className = "msgbox"; box.readOnly = true;
      const msg = () => driverMsg(d, link, nameIn.value.trim());
      const setSms = () => { txt.href = "sms:?&body=" + encodeURIComponent(msg()); };
      setSms(); nameIn.addEventListener("input", setSms);
      if (link) { mp.href = link; mp.target = "_blank"; mp.rel = "noopener"; } else mp.classList.add("hidden");
      cp.onclick = async () => {
        const m = msg(); let ok = false;
        try { await navigator.clipboard.writeText(m); ok = true; } catch(e){}
        if (!ok) { try { box.value = m; box.classList.add("on"); box.select(); ok = document.execCommand("copy"); } catch(e){} }
        if (!ok) { box.value = m; box.classList.add("on"); }
        cp.textContent = ok ? "Copied ✓" : "Copy below";
        if (ok) toast("Copied. Open Messages and paste it to " + (nameIn.value.trim() || "the driver") + ".");
        setTimeout(() => { cp.textContent = "Copy Route"; }, 2500);
      };
      acts.append(cp, txt, mp);
      b.append(acts, box);
      c.appendChild(b);
      o.appendChild(c);
    });

    if (Array.isArray(plan.later) && plan.later.length) {
      const lt = el("div","idle");
      lt.appendChild(el("b", null, "Timed orders: send at their time"));
      plan.later.forEach(x => lt.appendChild(el("div", null, "#" + (x.num ?? "?") + " " + (nice(x.name) || "Customer") + " · " + (x.kind === "timed" ? "at " : "by ") + (x.due || "?"))));
      o.appendChild(lt);
    }
    if (idle.length) o.appendChild(el("div","idle", [...new Set(idle.map(String))].join(", ") + ": stay back for new orders"));

    const rp = el("div","replan");
    [[1,"Single"],[2,"Double Up"],[3,"Triple Up"]].filter(([m]) => m !== mode).forEach(([m, t]) => {
      const btn = el("button", null, t);
      btn.onclick = () => { setMode(m); $("go").onclick(); };
      rp.appendChild(btn);
    });
    o.appendChild(rp);

    if (Array.isArray(plan.flags) && plan.flags.length) {
      const f = el("div","flags");
      f.appendChild(el("b", null, "Double-check"));
      const ul = document.createElement("ul");
      plan.flags.forEach(x => ul.appendChild(el("li", null, String(x))));
      f.appendChild(ul);
      o.appendChild(f);
    }

    const again = document.createElement("label"); again.className = "snap";
    again.textContent = "Snap New Screen";
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.setAttribute("capture","environment"); inp.setAttribute("aria-label","Snap a new screen");
    inp.addEventListener("change", e => { setMode(1); window.scrollTo({top:0}); onFiles(e.target.files); });
    again.appendChild(inp);
    o.appendChild(again);
    o.appendChild(el("p","foot","Drive times are estimates. No live traffic."));
    o.scrollIntoView({behavior:"smooth", block:"start"});
  }
})();
</script>
</body>
</html>
