<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zazzo’s Delivery Planner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍕</text></svg>">
<meta name="apple-mobile-web-app-title" content="Delivery">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF0F2; --card:#FFFFFF; --ink:#1C2430; --muted:#5B6573; --line:#D5DAE0;
  --red:#C8321E; --red-ink:#FFFFFF; --green:#2F6B3F; --amber:#A8650E; --late:#B42318;
  --chip:#E4E8EC;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151A21; --card:#1F262F; --ink:#ECEFF3; --muted:#9AA4B1; --line:#323B46;
    --red:#E0503A; --red-ink:#FFFFFF; --green:#6FBF83; --amber:#E3A54A; --late:#F07060;
    --chip:#2A323C; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#151A21; --card:#1F262F; --ink:#ECEFF3; --muted:#9AA4B1; --line:#323B46;
  --red:#E0503A; --red-ink:#FFFFFF; --green:#6FBF83; --amber:#E3A54A; --late:#F07060;
  --chip:#2A323C; color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font:700 2.1rem/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:8px 0 4px;letter-spacing:.01em}
.sub{color:var(--muted);margin:0 0 20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label.h{display:block;font:600 1.05rem/1.2 "Barlow Condensed",sans-serif;margin-bottom:8px;letter-spacing:.02em}
.photo{display:flex;align-items:center;justify-content:center;gap:10px;min-height:120px;border:2px dashed var(--line);border-radius:12px;cursor:pointer;color:var(--muted);text-align:center;padding:12px;position:relative;overflow:hidden}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{height:110px;border-radius:8px;border:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:48px;height:48px;border:0;background:var(--chip);color:var(--ink);font-size:1.4rem;cursor:pointer}
.stepper output{min-width:56px;text-align:center;font:700 1.6rem "Barlow Condensed",sans-serif}
select,input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:64px;resize:vertical}
.go{width:100%;border:0;border-radius:12px;background:var(--red);color:var(--red-ink);font:700 1.35rem "Barlow Condensed",sans-serif;letter-spacing:.03em;padding:15px;cursor:pointer}
.go:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.status{text-align:center;color:var(--muted);padding:18px 8px}
.err{color:var(--late)}
.summary{font-size:1.05rem;margin:4px 0 14px}
.driver{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--red);border-radius:12px;padding:14px 14px 12px;margin-bottom:14px}
.driver.idle{border-left-color:var(--line);color:var(--muted)}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.dh h2{font:700 1.5rem/1 "Barlow Condensed",sans-serif;margin:0}
.leave{font-weight:600}
.stops{list-style:none;margin:8px 0 10px;padding:0;counter-reset:s}
.stops li{position:relative;padding:8px 0 8px 36px;border-top:1px solid var(--line);counter-increment:s}
.stops li::before{content:counter(s);position:absolute;left:0;top:9px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--card);font:700 .95rem/26px "Barlow Condensed",sans-serif;text-align:center}
.who{font-weight:600}
.addr{color:var(--muted);font-size:.95rem}
.times{font-size:.92rem;margin-top:2px}
.tag{display:inline-block;font-size:.8rem;font-weight:600;padding:1px 8px;border-radius:99px;margin-left:6px;background:var(--chip)}
.tag.on_time{color:var(--green)} .tag.early{color:var(--amber)} .tag.tight{color:var(--amber)} .tag.late{color:var(--late)}
.dnote{font-size:.93rem;color:var(--muted);margin:0 0 10px}
.amap{display:inline-block;margin-top:6px;font-size:.9rem;font-weight:600;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.share{display:flex;gap:8px;margin-top:8px}
.share a,.share button{flex:1;text-align:center;text-decoration:none;border:0;border-radius:10px;padding:11px;font:inherit;font-weight:600;cursor:pointer;background:var(--ink);color:var(--card)}
.share button.copy{background:var(--chip);color:var(--ink)}
.dname{margin:2px 0 8px;font-size:.95rem;padding:8px 10px}
.msgbox{margin-top:8px;font-size:.9rem;min-height:120px}
.maps{display:block;text-align:center;text-decoration:none;border:2px solid var(--ink);color:var(--ink);border-radius:10px;padding:10px;font-weight:600}
.flags{border-left:6px solid var(--amber)}
.flags ul{margin:6px 0 0;padding-left:20px}
.again{width:100%;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;font:inherit;font-weight:600;cursor:pointer}
.hint{font-size:.88rem;color:var(--muted);margin-top:6px}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <h1>Delivery Planner</h1>
  <p class="sub">Snap the delivery screen, set your drivers, get the runs.</p>

  <section id="form">
    <div class="panel">
      <label class="h" for="file">Delivery screen photo</label>
      <div class="photo" id="drop">
        <span id="photoHint">Tap to take or choose a photo</span>
        <div class="thumbs hidden" id="thumbs"></div>
        <input id="file" type="file" accept="image/*" capture="environment" multiple>
      </div>
      <p class="hint">Take it right before planning. Elapsed times are read as of now.</p>
    </div>

    <div class="panel row">
      <label class="h" style="margin:0">Drivers available</label>
      <div class="stepper">
        <button type="button" id="minus" aria-label="Fewer drivers">−</button>
        <output id="count">2</output>
        <button type="button" id="plus" aria-label="More drivers">+</button>
      </div>
    </div>

    <div class="panel">
      <label class="h" for="store">Leaving from</label>
      <select id="store">
        <option value="Zazzo's Darien, 7360 IL-83, Darien, IL 60561">Darien (7360 IL-83)</option>
        <option value="Zazzo's Westmont, 200 W Ogden Ave, Westmont, IL 60559">Westmont (200 W Ogden)</option>
      </select>
    </div>

    <div class="panel">
      <label class="h" for="notes">Anything else? (optional)</label>
      <textarea id="notes" placeholder="e.g. Driver 2 isn’t back until 12:30. #4 is a big catering order."></textarea>
    </div>

    <button class="go" id="go" disabled>Plan routes</button>
  </section>

  <section id="out" aria-live="polite"></section>
</main>

<script>
(function(){
  const $ = id => document.getElementById(id);
  let files = [];
  let drivers = 2;
  let ctl = null;

  try { const s = localStorage.getItem("zz-store"); if (s) $("store").value = s; } catch(e){}
  try { const d = parseInt(localStorage.getItem("zz-drivers"),10); if (d>=1 && d<=10) drivers = d; } catch(e){}
  $("count").textContent = drivers;

  $("store").addEventListener("change", () => { try{localStorage.setItem("zz-store",$("store").value)}catch(e){} });
  function setDrivers(n){ drivers = Math.max(1, Math.min(10, n)); $("count").textContent = drivers; try{localStorage.setItem("zz-drivers",drivers)}catch(e){} }
  $("minus").onclick = () => setDrivers(drivers-1);
  $("plus").onclick = () => setDrivers(drivers+1);

  $("file").addEventListener("change", e => {
    files = Array.from(e.target.files || []).slice(0, 4);
    const t = $("thumbs"); t.textContent = "";
    files.forEach(f => { const img = document.createElement("img"); img.alt = "Delivery screen"; img.src = URL.createObjectURL(f); t.appendChild(img); });
    t.classList.toggle("hidden", !files.length);
    $("photoHint").classList.toggle("hidden", !!files.length);
    refresh();
  });

  function refresh(){ $("go").disabled = !files.length; }

  function getPin(force){
    let pin = null;
    try { pin = localStorage.getItem("zz-pin"); } catch(e){}
    if (!pin || force) {
      pin = (prompt(force ? "Wrong PIN. Enter the planner PIN:" : "Enter the planner PIN:") || "").trim();
      if (pin) { try { localStorage.setItem("zz-pin", pin); } catch(e){} }
    }
    return pin;
  }

  async function shrink(file){
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const max = 1600, r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL("image/jpeg", 0.82).split(",")[1];
    } finally { URL.revokeObjectURL(url); }
  }

  async function callPlan(prompt, imgs, signal, retry){
    const pin = getPin(retry);
    if (!pin) { const e = new Error("no pin"); e.code = "no_pin"; throw e; }
    const res = await fetch("/api/plan", { method: "POST", headers: {"Content-Type":"application/json"}, signal, body: JSON.stringify({ pin, prompt, images: imgs }) });
    if (res.status === 401 && !retry) return callPlan(prompt, imgs, signal, true);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error(data.error || "error"); e.code = res.status === 401 ? "bad_pin" : (res.status === 429 ? "rate_limited" : "server"); throw e; }
    const txt = String(data.text || "").replace(/```json|```/g, "").trim();
    const a = txt.indexOf("{"), b = txt.lastIndexOf("}");
    try { return JSON.parse(txt.slice(a, b + 1)); } catch(e){ const x = new Error("bad json"); x.code = "invalid_json"; throw x; }
  }

  function status(msg, isErr){
    const o = $("out"); o.textContent = "";
    const p = document.createElement("p"); p.className = "status" + (isErr ? " err" : ""); p.textContent = msg; o.appendChild(p);
    return p;
  }

  function nowStr(){ return new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); }

  function buildPrompt(){
    const store = $("store").value;
    const notes = $("notes").value.trim();
    return `You are the delivery dispatcher for a pizza restaurant in the western Chicago suburbs (DuPage County, IL). The image(s) show the restaurant's POS delivery screen.

HOW TO READ THE SCREEN
- Columns: # (order number), Name, Def, Address, Time, elp.
- A green check mark in the Def column = TIMED order. It must arrive AT the time in the Time column (not much earlier, never late). A few minutes early is OK; more than ~10 min early is "early".
- No check mark = REGULAR order. It must arrive within 60 minutes of when it came in. The "elp" column = minutes elapsed since it came in. For regular orders the Time column already shows the deadline (came in + 60 min); use it.
- The top-left corner of the screen shows the current time (e.g. "12:13 pm"). If visible, use THAT as the current time instead of the one below.
- A Driver panel on the left may list drivers already out, with "Est Return" times. Those drivers can't leave until they're back (allow ~2 min to load). Treat them as available at their return time, in addition to the drivers available now. Use their names (e.g. "Emily" for ZEMILY; drop a leading Z) as the driver label in "note".
- Addresses may be cut off or misspelled (e.g. "WILLOWBROOK" cut to "WILL(", "CLARE" = Clarendon Hills, "QUINCEY" = Quincy St). Fix them to real addresses near the store. Header lines like "Delivery: 45 = 12:16 pm" are quote times; ignore them.

CURRENT SITUATION
- Current time: ${nowStr()} (photo taken just now).
- All drivers leave from: ${store}.
- Drivers available right now: ${drivers}.
${notes ? "- Manager notes: " + notes : ""}

YOUR JOB
Assign every order to a driver and order each driver's stops so that:
1. Nothing is late. This beats everything.
2. Double up orders that are near each other and whose deadlines fit one trip. Don't send a driver out for one order if it rides along with another and stays on time.
3. Use fewer drivers when it doesn't risk lateness (idle drivers stay back for new orders), but use more if needed to stay on time.
4. Timed orders shouldn't arrive far too early; have that driver leave later or put the timed stop later in the run.
Estimate driving with real local street geography: about 2 to 3 minutes per mile on suburban roads, plus 2 minutes per stop for the handoff. Give a leave time for each driver (now or later). If an order can't be made on time with the drivers given, say so and give the best option.

Reply with ONLY this JSON (no other text):
{
 "summary": "one plain sentence, e.g. '2 drivers needed; driver 3 and 4 stay back.'",
 "drivers": [
  {"driver": 1, "leave_at": "12:10 PM", "note": "short why, plain words", "stops": [
    {"num": "3", "name": "MADEJ", "address": "7850 S Quincy St, Willowbrook, IL 60527", "kind": "timed", "due": "12:15 PM", "eta": "12:14 PM", "status": "on_time"}
  ]}
 ],
 "flags": ["anything unreadable, guessed, or at risk; empty array if none"]
}
Rules for the JSON: include every driver 1..${drivers}; a driver with no orders gets "stops": [] and "note": "Stays back". kind is "timed" or "regular". status is one of on_time, early, tight (under 5 min to spare), late. Times like "12:14 PM". Full street addresses with city and state.`;
  }

  $("go").onclick = async () => {
    if (!files.length) return;
    ctl = new AbortController();
    $("go").disabled = true;
    const o = $("out"); o.textContent = "";
    const p = document.createElement("p"); p.className = "status"; p.textContent = "Reading the screen and planning routes… this can take up to a minute.";
    const stop = document.createElement("button"); stop.className = "again"; stop.textContent = "Stop"; stop.onclick = () => ctl.abort();
    o.append(p, stop);
    try {
      const imgs = await Promise.all(files.map(shrink));
      const plan = await callPlan(buildPrompt(), imgs, ctl.signal, false);
      render(plan);
    } catch(e){
      const code = e && e.code;
      if (e && e.name === "AbortError") { o.textContent = ""; }
      else if (code === "no_pin" || code === "bad_pin") status("PIN needed. Tap Plan routes and enter the PIN.", true);
      else if (code === "rate_limited") status("Too many requests right now. Wait a minute and try again.", true);
      else if (code === "invalid_json") status("Couldn’t build a plan from that photo. Try again or retake it closer.", true);
      else status("Something went wrong. Tap Plan routes to try again.", true);
    } finally { $("go").disabled = false; refresh(); }
  };

  function mapsLink(origin, stops){
    if (!stops.length) return null;
    const addrs = stops.map(s => s.address || "");
    const dest = addrs[addrs.length-1];
    const way = addrs.slice(0,-1);
    let u = "https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=" + encodeURIComponent(origin.replace(/^Zazzo's \w+, /,"")) + "&destination=" + encodeURIComponent(dest);
    if (way.length) u += "&waypoints=" + encodeURIComponent(way.join("|"));
    return u;
  }

  const LABEL = {on_time:"On time", early:"Early", tight:"Tight", late:"Late"};

  function nice(s){
    return String(s || "").toLowerCase().replace(/\b([a-z])/g, m => m.toUpperCase())
      .replace(/\b(Il|Ne|Nw|Se|Sw)\b/g, m => m.toUpperCase())
      .replace(/,\s*$/, "").trim();
  }
  function shortAddr(a){
    return String(a || "").replace(/,?\s*(IL|Illinois)\s*\d{5}(-\d{4})?\s*$/i, "").replace(/,?\s*USA\s*$/i, "").trim();
  }
  function driverMsg(d, link, name){
    const n = d.stops.length;
    const out = [];
    out.push((name ? "Hi " + name + ", here’s your run." : "Here’s your run."));
    out.push("Leave at " + (d.leave_at || "now") + ", " + n + (n === 1 ? " stop" : " stops") + ".");
    d.stops.forEach((s, i) => {
      out.push("");
      const who = nice(s.name) || "Customer";
      out.push((i+1) + ". " + who + (s.num != null ? " (order " + s.num + ")" : ""));
      out.push("    " + shortAddr(s.address));
      out.push("    " + (s.kind === "timed" ? "Deliver at " : "Deliver by ") + (s.due || "?"));
    });
    if (link) { out.push(""); out.push("Route map:"); out.push(link); }
    out.push(""); out.push("Thanks!");
    return out.join("\n");
  }

  function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function render(plan){
    const o = $("out"); o.textContent = "";
    if (!plan || !Array.isArray(plan.drivers)) { status("Couldn’t build a plan from that photo. Try again.", true); return; }
    if (plan.summary) o.appendChild(el("p","summary", String(plan.summary)));
    const origin = $("store").value;

    const active = plan.drivers.filter(d => Array.isArray(d.stops) && d.stops.length);
    const idle = plan.drivers.filter(d => !Array.isArray(d.stops) || !d.stops.length);

    active.forEach(d => {
      const c = el("div","driver");
      const h = el("div","dh");
      h.appendChild(el("h2", null, "Driver " + (d.driver ?? "")));
      h.appendChild(el("span","leave", "Leave " + (d.leave_at || "now")));
      c.appendChild(h);
      if (d.note) c.appendChild(el("p","dnote", String(d.note)));
      const ul = el("ol","stops");
      d.stops.forEach(s => {
        const li = document.createElement("li");
        li.appendChild(el("div","who", "#" + (s.num ?? "?") + " " + (s.name || "")));
        li.appendChild(el("div","addr", s.address || ""));
        const t = el("div","times", (s.kind === "timed" ? "Timed " : "Due by ") + (s.due || "?") + " · arrive ~" + (s.eta || "?"));
        if (s.status && LABEL[s.status]) t.appendChild(el("span","tag " + s.status, LABEL[s.status]));
        li.appendChild(t);
        ul.appendChild(li);
      });
      c.appendChild(ul);
      const link = mapsLink(origin, d.stops);
      if (link) { const a = el("a","maps","Show on map"); a.href = link; a.target = "_blank"; a.rel = "noopener"; c.appendChild(a); }

      const nameIn = document.createElement("input"); nameIn.type = "text"; nameIn.className = "dname"; nameIn.placeholder = "Driver name for the text (e.g. Laura)"; nameIn.setAttribute("aria-label","Driver name");
      c.insertBefore(nameIn, ul);
      const share = el("div","share");
      const txt = el("a",null,"Text driver");
      const cp = el("button","copy","Copy");
      const box = document.createElement("textarea"); box.className = "msgbox hidden"; box.readOnly = true;
      const msg = () => driverMsg(d, link, nameIn.value.trim());
      const setSms = () => { txt.href = "sms:?&body=" + encodeURIComponent(msg()); };
      setSms(); nameIn.addEventListener("input", setSms);
      txt.target = "_blank"; txt.rel = "noopener";
      cp.onclick = async () => {
        const m = msg(); let ok = false;
        try { await navigator.clipboard.writeText(m); ok = true; } catch(e){}
        if (!ok) { try { box.value = m; box.classList.remove("hidden"); box.select(); ok = document.execCommand("copy"); } catch(e){} }
        box.value = m; box.classList.remove("hidden");
        cp.textContent = ok ? "Copied" : "Select & copy below";
        setTimeout(() => { cp.textContent = "Copy"; }, 2500);
      };
      share.append(txt, cp);
      c.append(share, box);
      o.appendChild(c);
    });

    if (idle.length) {
      const c = el("div","driver idle");
      c.appendChild(el("div","who", idle.map(d => "Driver " + d.driver).join(", ") + ": stay back for new orders"));
      o.appendChild(c);
    }

    if (Array.isArray(plan.flags) && plan.flags.length) {
      const f = el("div","panel flags");
      f.appendChild(el("div","who","Double-check"));
      const ul = document.createElement("ul");
      plan.flags.forEach(x => ul.appendChild(el("li", null, String(x))));
      f.appendChild(ul);
      o.appendChild(f);
    }

    o.appendChild(el("p","hint","Drive times are estimates. No live traffic."));
    const again = el("button","again","New photo");
    again.onclick = () => { $("file").value = ""; files = []; $("thumbs").textContent=""; $("thumbs").classList.add("hidden"); $("photoHint").classList.remove("hidden"); o.textContent=""; refresh(); window.scrollTo({top:0,behavior:"smooth"}); };
    o.appendChild(again);
    o.scrollIntoView({behavior:"smooth", block:"start"});
  }
})();
</script>
</body>
</html>
